<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PO Tracker</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --border: #e3e3e6; --text: #1a1a1e;
    --muted: #6b6b74; --accent: #4f46e5; --accent-hover: #4338ca;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 24px 32px 8px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .container { max-width: 700px; margin: 0 auto; padding: 0 32px 60px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); }
  input[type=text] { flex: 1; min-width: 160px; }
  button { font: inherit; padding: 8px 14px; border: none; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { background: var(--accent-hover); }
  button.danger { background: transparent; color: #dc2626; border: 1px solid var(--border); }
  .search-bar { margin-bottom: 16px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .item-title { font-weight: 600; }
  .item-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="container" style="padding:0;">
    <h1>PO Tracker</h1>
    <div class="sub">Completed PO numbers, in one place.</div>
  </div>
</header>
<div class="container">

  <div class="card">
    <div class="row">
      <input type="text" id="po-input" placeholder="PO number (e.g. 4133)" />
      <button id="po-add-btn">Add PO</button>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="po-search" placeholder="Search PO number..." style="width:100%;" />
  </div>

  <ul class="list" id="po-list"></ul>
  <div class="empty" id="po-empty" style="display:none;">No PO numbers recorded yet.</div>
</div>

<script>
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const poListEl = document.getElementById('po-list');
const poEmptyEl = document.getElementById('po-empty');
const poInputEl = document.getElementById('po-input');
const poSearchEl = document.getElementById('po-search');

let allPos = [];

async function fetchPos() {
  const res = await fetch('/api/pos');
  return res.json();
}

function renderPos(pos) {
  poListEl.innerHTML = '';
  poEmptyEl.style.display = pos.length ? 'none' : 'block';
  for (const p of pos) {
    const li = document.createElement('li');
    li.className = 'item';
    li.innerHTML = `
      <div>
        <div class="item-title">PO ${escapeHtml(p.po_number)}</div>
        <div class="item-meta">added ${new Date(/[Z+]|-\d\d:\d\d$/.test(p.created_at) ? p.created_at : p.created_at + 'Z').toLocaleString()}</div>
      </div>
      <button class="danger" data-id="${p.id}">Delete</button>
    `;
    poListEl.appendChild(li);
  }
}

function applyFilter() {
  const q = poSearchEl.value.trim();
  const filtered = q ? allPos.filter(p => p.po_number.includes(q)) : allPos;
  renderPos(filtered);
}

async function refreshPos() {
  allPos = await fetchPos();
  applyFilter();
}

async function addPo() {
  const po_number = poInputEl.value.trim();
  if (!po_number) return;
  const res = await fetch('/api/pos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ po_number })
  });
  if (res.status === 409) {
    alert('That PO number is already recorded.');
    return;
  }
  poInputEl.value = '';
  refreshPos();
}

document.getElementById('po-add-btn').addEventListener('click', addPo);
poInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addPo();
});

poSearchEl.addEventListener('input', applyFilter);

poListEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (!confirm('Delete this PO number?')) return;
  await fetch(`/api/pos/${btn.dataset.id}`, { method: 'DELETE' });
  refreshPos();
});

refreshPos();
</script>
</body>
</html>
