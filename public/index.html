<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jot Form Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f9;
    --panel: #ffffff;
    --border: #e6e7ee;
    --text: #14141a;
    --muted: #6c6f80;
    --accent: #5850ec;
    --accent-hover: #4640c9;
    --accent-soft: #eef0ff;
    --danger: #e0344c;
    --danger-soft: #fdecef;
    --success: #12875a;
    --success-soft: #e9f9f1;
    --shadow: 0 1px 2px rgba(20,20,26,.04), 0 8px 24px -12px rgba(20,20,26,.10);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1016;
      --panel: #1a1b23;
      --border: #2a2c38;
      --text: #f1f2f6;
      --muted: #9395a8;
      --accent: #7c74ff;
      --accent-hover: #6a62f0;
      --accent-soft: #232244;
      --danger: #ff6b81;
      --danger-soft: #2c1a20;
      --success: #34d399;
      --success-soft: #142a22;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(1200px 480px at 15% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 48px 24px 8px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), #9b6bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
    box-shadow: 0 6px 16px -4px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14.5px; margin: 0 0 28px 52px; }
  .container { max-width: 700px; margin: 0 auto; padding: 0 24px 60px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }

  input {
    font: inherit;
    font-size: 14.5px;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: var(--muted); }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  input[type=text] { flex: 1; min-width: 160px; }

  button {
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button.danger {
    background: transparent;
    color: var(--danger);
    border: 1.5px solid var(--border);
    font-weight: 500;
    padding: 7px 12px;
    font-size: 13px;
  }
  button.danger:hover { background: var(--danger-soft); border-color: var(--danger); }

  .controls-bar { display: flex; gap: 10px; margin-bottom: 20px; }
  .controls-bar input { width: 100%; }
  select.sort-select {
    font: inherit;
    font-size: 14px;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  select.sort-select:focus { outline: none; border-color: var(--accent); }

  .list-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 4px 2px 12px;
  }
  .list-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .count-badge {
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 3px 10px; border-radius: 999px;
  }

  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  li.item:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); box-shadow: var(--shadow); }

  .item-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .po-chip {
    flex-shrink: 0;
    font-weight: 700; font-size: 13px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 6px 11px;
    border-radius: 8px;
    letter-spacing: .01em;
  }
  .item-text { min-width: 0; }
  .item-title { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vendor-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; color: var(--muted); font-weight: 500;
  }
  .vendor-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .item-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .empty {
    color: var(--muted); text-align: center; padding: 56px 20px;
    background: var(--panel); border: 1.5px dashed var(--border); border-radius: var(--radius);
    font-size: 14px;
  }

  .inline-msg { font-size: 13px; margin-top: 10px; font-weight: 500; min-height: 18px; }
  .inline-msg.error { color: var(--danger); }
  .inline-msg.success { color: var(--success); }
</style>
</head>
<body>
<header>
  <div class="container" style="padding:0;">
    <div class="brand">
      <div class="brand-mark">📋</div>
      <h1>Jot Form Tracker</h1>
    </div>
    <div class="sub">Completed PO numbers, in one place.</div>
  </div>
</header>
<div class="container">

  <div class="card">
    <div class="row">
      <input type="text" id="po-input" placeholder="PO number (e.g. 4133)" />
      <button id="po-add-btn">Add PO</button>
    </div>
    <div class="inline-msg" id="po-msg"></div>
  </div>

  <div class="controls-bar">
    <input type="text" id="po-search" placeholder="Search PO number..." />
    <select id="po-sort" class="sort-select">
      <option value="recent">Sort: Most recent</option>
      <option value="po-asc">Sort: PO number (ascending)</option>
      <option value="po-desc">Sort: PO number (descending)</option>
      <option value="vendor-asc">Sort: Vendor (A-Z)</option>
      <option value="vendor-desc">Sort: Vendor (Z-A)</option>
    </select>
  </div>

  <div class="list-header">
    <span class="list-title">Completed POs</span>
    <span class="count-badge" id="po-count">0</span>
  </div>

  <ul class="list" id="po-list"></ul>
  <div class="empty" id="po-empty" style="display:none;">No PO numbers recorded yet.</div>
</div>

<script>
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const VENDOR_COLORS = ['#5850ec', '#e0344c', '#12875a', '#d97706', '#0891b2', '#c026d3', '#65a30d', '#4f46e5'];
function vendorColor(name) {
  if (!name) return '#93959f';
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return VENDOR_COLORS[hash % VENDOR_COLORS.length];
}

const poListEl = document.getElementById('po-list');
const poEmptyEl = document.getElementById('po-empty');
const poInputEl = document.getElementById('po-input');
const poSearchEl = document.getElementById('po-search');
const poSortEl = document.getElementById('po-sort');
const poMsgEl = document.getElementById('po-msg');
const poCountEl = document.getElementById('po-count');

let allPos = [];

function showMsg(text, type) {
  poMsgEl.textContent = text;
  poMsgEl.className = 'inline-msg' + (type ? ' ' + type : '');
}

async function fetchPos() {
  const res = await fetch('/api/pos');
  return res.json();
}

function renderPos(pos) {
  poListEl.innerHTML = '';
  poEmptyEl.style.display = pos.length ? 'none' : 'block';
  poCountEl.textContent = pos.length;
  for (const p of pos) {
    const li = document.createElement('li');
    li.className = 'item';
    const addedDate = new Date(/[Z+]|-\d\d:\d\d$/.test(p.created_at) ? p.created_at : p.created_at + 'Z');
    li.innerHTML = `
      <div class="item-main">
        <div class="po-chip">PO ${escapeHtml(p.po_number)}</div>
        <div class="item-text">
          ${p.vendor
            ? `<div class="vendor-tag"><span class="vendor-dot" style="background:${vendorColor(p.vendor)}"></span>${escapeHtml(p.vendor)}</div>`
            : `<div class="vendor-tag" style="opacity:.6">No vendor matched</div>`}
          <div class="item-meta">added ${addedDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</div>
        </div>
      </div>
      <button class="danger" data-id="${p.id}">Delete</button>
    `;
    poListEl.appendChild(li);
  }
}

function applyFilter() {
  const q = poSearchEl.value.trim();
  let filtered = q ? allPos.filter(p => p.po_number.includes(q)) : allPos.slice();

  const sortMode = poSortEl.value;
  if (sortMode === 'po-asc') {
    filtered.sort((a, b) => a.po_number.localeCompare(b.po_number, undefined, { numeric: true }));
  } else if (sortMode === 'po-desc') {
    filtered.sort((a, b) => b.po_number.localeCompare(a.po_number, undefined, { numeric: true }));
  } else if (sortMode === 'vendor-asc') {
    filtered.sort((a, b) => (a.vendor || '').localeCompare(b.vendor || ''));
  } else if (sortMode === 'vendor-desc') {
    filtered.sort((a, b) => (b.vendor || '').localeCompare(a.vendor || ''));
  }
  // 'recent' relies on the server's default order (created_at DESC), so no re-sort needed.

  renderPos(filtered);
}

async function refreshPos() {
  allPos = await fetchPos();
  applyFilter();
}

async function addPo() {
  const po_number = poInputEl.value.trim();
  if (!po_number) return;
  const res = await fetch('/api/pos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ po_number })
  });
  if (res.status === 409) {
    showMsg(`PO ${po_number} was already entered previously.`, 'error');
    return;
  }
  showMsg(`PO ${po_number} added.`, 'success');
  poInputEl.value = '';
  refreshPos();
}

document.getElementById('po-add-btn').addEventListener('click', addPo);
poInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addPo();
});
poInputEl.addEventListener('input', () => showMsg('', ''));

poSearchEl.addEventListener('input', applyFilter);
poSortEl.addEventListener('change', applyFilter);

poListEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (!confirm('Delete this PO number?')) return;
  await fetch(`/api/pos/${btn.dataset.id}`, { method: 'DELETE' });
  refreshPos();
});

refreshPos();
</script>
</body>
</html>
